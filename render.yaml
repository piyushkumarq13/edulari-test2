services:
  - type: web
    name: edulari
    env: node
    region: singapore
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_BUCKET_REGION
        sync: false
      - key: B2_ACCESS_KEY_ID
        sync: false
      - key: B2_SECRET_ACCESS_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://your-edulari.onrender.com # Update after deployment
      - key: CRON_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
    healthCheckPath: /api/health
    autoDeploy: true
